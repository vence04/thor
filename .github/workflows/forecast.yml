name: forecast
on:
  schedule:
    # Asks for a run every 15 minutes, but do not read that as a 15-minute forecast.
    # GitHub runs scheduled workflows on a best-effort queue and drops most of them:
    # with a plain hourly "8 * * * *" this repo actually fired at 23:56, 04:37 and
    # 10:09 - three times in fifteen hours, up to five hours apart, and never at :08.
    # Asking four times an hour gets roughly one real run an hour. Open-Meteo only
    # publishes hourly anyway, so a run that finds nothing new just republishes the
    # same numbers; the cost of over-asking is a few extra free public-repo minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# This repo is public, so Actions minutes here are free and unlimited. The model is
# trained in the private vence04/bearpaw-weather, which publishes data/model.json here.
concurrency:
  group: forecast
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests lightgbm
      - name: Generate corrected forecast
        run: python scripts/predict.py
      - name: Commit forecast
        run: |
          git config user.name "bearpaw-bot"
          git config user.email "noreply@github.com"
          git add forecast.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "forecast $(date -u +%FT%TZ)"
          # The hourly forecast and the weekly retrain both push to main here, and the
          # retrain dispatches the forecast as its last step, so they race by design.
          # A rejected push used to fail the run and silently leave the site stale.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push after 5 attempts - another writer holds main"
          exit 1
