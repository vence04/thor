name: forecast
on:
  schedule:
    # Asks for a run every 5 minutes, but do not read that as a 5-minute forecast.
    # GitHub runs scheduled workflows on a best-effort queue and drops most of them:
    # with a plain hourly "8 * * * *" this repo fired at 23:56, 04:37 and 10:09 -
    # three times in fifteen hours, never at :08. "*/15" did better but not well:
    # measured 2026-10-17, thirteen runs in forty-three hours, gaps of 4h05, 4h15 and
    # 5h15. Two changes here. Asking twelve times an hour instead of four is free on a
    # public repo. And none of these minutes is :00, :15, :30 or :45, which is when
    # every other cron on GitHub fires and the queue is deepest - "*/15" asked only at
    # the four worst minutes of the hour.
    #
    # None of that can make the scheduler reliable, so the page and the Home Assistant
    # package no longer assume it is: both pick the hour that is current now instead of
    # reading entry 0, and a file hours old still shows the right numbers.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

# This repo is public, so Actions minutes here are free and unlimited. The model is
# trained in the private vence04/bearpaw-weather, which publishes data/model.json here.
concurrency:
  group: forecast
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyarrow is needed to read the station history, which the collapse guard in
      # predict.py measures a correction against. Without it the guard silently fell
      # back to the forecast's own spread and rejected the wind correction every run.
      - run: pip install -q pandas numpy requests lightgbm pyarrow
      - name: Generate corrected forecast
        run: python scripts/predict.py
      - name: Commit forecast
        run: |
          git config user.name "bearpaw-bot"
          git config user.email "noreply@github.com"
          git add forecast.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "forecast $(date -u +%FT%TZ)"
          # The hourly forecast and the weekly retrain both push to main here, and the
          # retrain dispatches the forecast as its last step, so they race by design.
          # A rejected push used to fail the run and silently leave the site stale.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push after 5 attempts - another writer holds main"
          exit 1
