name: retrain
on:
  schedule:
    - cron: "40 6 * * 1"   # weekly, Monday 06:40 UTC
  workflow_dispatch: {}

# Runs here rather than in the private vence04/bearpaw-weather because this repo is
# public: its Actions minutes are free and unlimited, and unaffected by the private-repo
# spending cap that blocked everything on 2026-09-12. Everything the retrain reads and
# writes was already published here as the data feed, so nothing new is exposed.
permissions:
  contents: write
  actions: write   # the last step dispatches forecast.yml; contents alone is not enough

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      # Fails loudly if no observations can be fetched. That is deliberate: this step
      # used to exit 0 on failure and hid a dead weather station for two months.
      - name: Update actuals (Ecowitt.net cloud)
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python scripts/update_actuals.py

      - name: Refresh archived forecasts
        run: python scripts/fetch_archived_forecasts.py
      - name: Source bake-off
        run: python scripts/bakeoff.py
      - name: Train + backtest
        run: python scripts/train.py

      - name: Commit results
        run: |
          git config user.name "bearpaw-bot"
          git config user.email "noreply@github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "weekly retrain $(date -u +%F)"
          # The hourly forecast and the weekly retrain both push to main here, and the
          # retrain dispatches the forecast as its last step, so they race by design.
          # A rejected push used to fail the run and silently leave the site stale.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push after 5 attempts - another writer holds main"
          exit 1

      - name: Regenerate forecast with the new model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast.yml --repo ${{ github.repository }}
